; Target: Waveshare ESP32-S3-Touch-AMOLED-1.75C (32 MB flash, 8 MB octal PSRAM)
[platformio]
default_envs = amoled175c
; Non-ASCII project path on Windows: build with tools/build_firmware.py instead of plain `pio run`.

[env:amoled175c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep
lib_deps =
  symlink://../core/libcompanion
  moononournation/GFX Library for Arduino @ 1.6.9
  lewisxhe/SensorLib @ 0.3.3
  lewisxhe/XPowersLib @ 0.2.6
  h2zero/NimBLE-Arduino @ 1.4.3
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -O2
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -DXPOWERS_CHIP_AXP2101
